[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qf_ieee"
version = "0.1.0"
description = "Replication code for the matched-filter normalization of order flow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The authors" }]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.24,<2.1",
    "scipy>=1.10,<2.0",
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.12,<1.0",
    "scikit-learn>=1.3,<2.0",
    "pyarrow>=14,<25",
    "python-calamine>=0.2,<1.0",
    "statsmodels>=0.14,<0.15",
    "linearmodels>=6.0,<7.0",
    "pingouin>=0.5,<0.6",
]

[tool.setuptools]
package-dir = { "" = "code" }

[tool.setuptools.packages.find]
where = ["code"]
include = ["shared_utils*"]
